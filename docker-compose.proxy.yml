services:
  lumo-api:
    ports: !reset []
    networks:
      - reverse-proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  reverse-proxy:
    external: true
    name: ${LUMO_PROXY_NETWORK:?Define LUMO_PROXY_NETWORK with the reverse proxy network}
