name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run fmt:check
      - name: Check types and regression tests
        run: |
          bun run lint
          bun run typecheck
          bun run test
      - name: Audit frontend dependencies
        run: bun run audit
      - name: Build frontend
        run: bun run build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          ./scripts/deploy.sh --help | grep --fixed-strings -- '--first-v2-cutover'
          ! grep --extended-regexp -- 'restore_backup_data|find /data .*rm -rf|--remove-orphans|docker compose down' \
            scripts/deploy.sh
          rollback_body="$(sed -n '/^rollback_release()/,/^}/p' scripts/deploy.sh)"
          grep --fixed-strings 'check_public_v2_contract' <<<"$rollback_body" >/dev/null
          grep --fixed-strings 'without rewinding live data' <<<"$rollback_body" >/dev/null
      - name: Verify Rust workspace
        env:
          # Keep upstream path-dependency warnings visible. The script applies
          # -D warnings to every workspace crate through strict Clippy.
          RUSTFLAGS: ""
        run: ./scripts/verify-local-backend.sh
      - name: Verify GLib upstream backport and optimized regressions
        env:
          RUSTFLAGS: ""
        run: |
          python3 vendor/glib/verify_backport.py
          python3 vendor/glib/test_verify_backport.py
          cargo test --manifest-path vendor/glib/Cargo.toml --release --locked \
            --lib --test variant_str_iter_backport --target-dir target/backports

  dependencies:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Install pinned audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit known vulnerabilities and unsound dependencies
        run: cargo audit --deny unsound --deny yanked

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      LUMO_RUNTIME_MODE: remote
      LUMO_API_URL: https://api.example.com
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: aarch64-linux-android
      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
          bun install --frozen-lockfile
      - name: Initialize Android project
        run: bun run tauri android init --ci --skip-targets-install
      - name: Compile Android client
        run: bun run tauri android build --debug --apk --target aarch64 --ci -- --locked
      - name: Test and lint native plugin
        working-directory: mobile/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-lumo-mobile:testDebugUnitTest :tauri-plugin-lumo-mobile:lintDebug --no-daemon
      - name: Verify lockfiles remained unchanged
        run: git diff --exit-code -- ../Cargo.lock bun.lock

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose deployment models
        env:
          LUMO_SERVER_MASTER_KEY: ci-only-random-server-master-key-32-bytes
          LUMO_ENABLE_LEGACY_V1: "false"
          LUMO_PROXY_NETWORK: lumo-ci-proxy
        run: |
          required=2.24.4
          actual="$(docker compose version --short)"
          actual="${actual#v}"
          actual="${actual%%-*}"
          test "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n 1)" = "$required"

          base_json="$(docker compose config --format json)"
          jq -e '
            .name == "lumo"
              and .volumes["lumo-data"].name == "lumo_lumo-data"
          ' <<<"$base_json"
          jq -e '
            .services["lumo-api"] as $service
            | $service.read_only == true
              and (($service.tmpfs // []) | length > 0)
              and ((($service.cap_drop // []) | index("ALL")) != null)
              and ((($service.security_opt // []) | index("no-new-privileges:true")) != null)
              and $service.pids_limit == 128
              and (($service.mem_limit | tonumber) == 268435456)
              and (($service.cpus | tonumber) == 1)
              and (($service.ports // []) | length == 1)
              and all($service.ports[]; .host_ip == "127.0.0.1")
              and (($service.environment.LUMO_ENABLE_LEGACY_V1 | tostring | ascii_downcase) == "false")
              and $service.logging.options["max-size"] == "10m"
              and (($service.logging.options["max-file"] | tostring) == "3")
          ' <<<"$base_json"

          proxy_json="$(
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.proxy.yml \
              config --format json
          )"
          jq -e '
            .services["lumo-api"] as $service
            | (($service.ports // []) | length) == 0
              and (($service.networks // {}) | has("reverse-proxy"))
              and $service.read_only == true
              and ((($service.cap_drop // []) | index("ALL")) != null)
              and ((($service.security_opt // []) | index("no-new-privileges:true")) != null)
              and $service.pids_limit == 128
              and (($service.mem_limit | tonumber) == 268435456)
              and (($service.cpus | tonumber) == 1)
          ' <<<"$proxy_json"

          custom_identity_json="$(
            COMPOSE_PROJECT_NAME=lumo-live \
            LUMO_DATA_VOLUME=lumo-live-data \
              docker compose config --format json
          )"
          jq -e '
            .name == "lumo-live"
              and .volumes["lumo-data"].name == "lumo-live-data"
          ' <<<"$custom_identity_json"
      - name: Build image
        run: docker build --tag lumo-api:ci .
      - name: Create temporary TLS certificate
        run: |
          mkdir .ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout .ci-certs/privkey.pem \
            -out .ci-certs/fullchain.pem \
            -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost'
          chmod 0444 .ci-certs/fullchain.pem
          chmod 0400 .ci-certs/privkey.pem
          sudo chown 10001:0 .ci-certs/privkey.pem
      - name: Start and verify API
        env:
          LUMO_SERVER_MASTER_KEY: ci-only-random-server-master-key-32-bytes
          LUMO_ENABLE_LEGACY_V1: "false"
        run: |
          docker run --detach --name lumo-api-ci \
            --publish 127.0.0.1:8443:8443 \
            --read-only \
            --tmpfs /data:uid=10001,mode=0700 \
            --tmpfs /tmp:uid=10001,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 256m \
            --cpus 1 \
            --log-driver json-file \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            --volume "$PWD/.ci-certs:/certs:ro" \
            --env LUMO_SERVER_MASTER_KEY \
            --env LUMO_ENABLE_LEGACY_V1 \
            lumo-api:ci

          docker inspect lumo-api-ci | jq -e '.[0] |
            .HostConfig.ReadonlyRootfs == true
            and .HostConfig.PidsLimit == 128
            and .HostConfig.Memory == 268435456
            and .HostConfig.NanoCpus == 1000000000
            and ((.HostConfig.CapDrop | index("ALL")) != null)
            and ((.HostConfig.SecurityOpt | index("no-new-privileges:true")) != null)
          '

          for attempt in {1..30}; do
            if health_json="$(curl --fail --silent --show-error \
              --cacert .ci-certs/fullchain.pem \
              https://localhost:8443/health)" && \
              jq -e '.status == "ok" and .apiVersion == "v2"' \
                <<<"$health_json" >/dev/null; then
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --cacert .ci-certs/fullchain.pem \
                https://localhost:8443/v1/state)" = "404"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --cacert .ci-certs/fullchain.pem \
                https://localhost:8443/v2/groups)" = "405"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: docker logs lumo-api-ci || true
      - name: Remove test container
        if: always()
        run: docker rm --force lumo-api-ci || true
