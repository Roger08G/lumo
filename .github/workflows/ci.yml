name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run fmt:check
      - name: Build frontend
        run: bun run build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Verify Rust workspace
        run: ./scripts/verify-local-backend.sh

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        env:
          LUMO_API_PASSWORD: ci-only-random-secret-with-32-bytes
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag lumo-api:ci .
      - name: Create temporary TLS certificate
        run: |
          mkdir .ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout .ci-certs/privkey.pem \
            -out .ci-certs/fullchain.pem \
            -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost'
          sudo chown -R 10001:0 .ci-certs
          chmod 0400 .ci-certs/*.pem
      - name: Start and verify API
        env:
          LUMO_API_PASSWORD: ci-only-random-secret-with-32-bytes
        run: |
          docker run --detach --name lumo-api-ci \
            --publish 127.0.0.1:8443:8443 \
            --tmpfs /data:uid=10001,mode=0700 \
            --volume "$PWD/.ci-certs:/certs:ro" \
            --env LUMO_API_PASSWORD \
            lumo-api:ci

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --cacert .ci-certs/fullchain.pem \
              https://localhost:8443/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: docker logs lumo-api-ci || true
      - name: Remove test container
        if: always()
        run: docker rm --force lumo-api-ci || true
