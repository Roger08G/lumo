[package]
name = "lumo-mobile"
version.workspace = true
description = "Family location, simply."
authors.workspace = true
edition.workspace = true
license.workspace = true
default-run = "lumo-mobile"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumo_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
lumo-core = { path = "../../crates/lumo-core" }
lumo-runtime = { path = "../../crates/lumo-runtime" }
tauri-plugin-lumo-mobile = { path = "../../plugins/tauri-plugin-lumo-mobile" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"
tauri-plugin-geolocation = "2.3.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
